server:
  port: 8080

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # Flyway owns the schema, Hibernate just validates it
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # 256-bit+ secret — override via JWT_SECRET env var in real deployments, never commit a real one
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-string-in-prod-please}
    expiration-ms: 86400000   # 24h access token
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
